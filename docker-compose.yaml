# Thợ nền cào + đẩy sang EPG. Coolify đọc thẳng file này (Docker Compose),
# hoặc chạy tay:  docker compose up -d --build
#
# Bắt buộc đặt hai biến bí mật (Coolify > Environment Variables):
#   EPG_URL          https://epg.vtcrd.top
#   EPG_CRAWL_TOKEN  đúng chuỗi đặt ở app EPG
services:
  cao:
    build:
      context: .
      dockerfile: Dockerfile
    image: epg-cao:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Ho_Chi_Minh
      # Đặt hai biến này trên Coolify, KHÔNG ghi thẳng token vào đây:
      # EPG_URL: "https://epg.vtcrd.top"
      # EPG_CRAWL_TOKEN: "..."
    # Khoẻ = vòng lặp còn chạy VÀ hỏi được lịch từ EPG trong 10 phút gần nhất
    # (file /tmp/cao-alive do thợ nền ghi mỗi lần hỏi lịch thành công).
    # Đèn đỏ tức là bộ cào không nói chuyện được với EPG — xem log.
    healthcheck:
      test: ["CMD", "python", "-c",
             "import os,sys,time; p='/tmp/cao-alive'; sys.exit(0 if os.path.exists(p) and time.time()-os.path.getmtime(p) < 600 else 1)"]
      interval: 60s
      timeout: 5s
      start_period: 120s
      retries: 2
    volumes:
      # Nhớ mốc đã cào + giữ file output giữa các lần khởi động lại
      - cao-data:/data
volumes:
  cao-data:
